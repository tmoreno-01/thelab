   else if(c.law===4){main=Math.sin(v*.27+phase*1.12)*.66+Math.sin(u*.2-phase*.45)*.4;secondary=Math.sign(Math.sin(v*.43-phase*.7))*.35;}
   else{main=Math.sin(v*.18+phase*.83)*.48+b*.48;secondary=Math.sin(u*.31+phase*.59)*.62;}
   const gate=.72+.28*Math.sin(u*.12+v*.16+phase*.44+c.phase),strength=c.amp*envelope*fade*gate;
   const sx=Math.round((c.ax*main+c.nx*secondary)*strength),sy=Math.round((c.ay*main+c.ny*secondary)*strength);
   if(!sx&&!sy)continue;
   const tx=clamp(x+sx,c.x0+1,c.x1-2),ty=clamp(y+sy,c.y0+1,c.y1-2);
   renderField[i]=source[ty*W+tx];
   flowCells++;
  }
 }
}
function sense(){
 if(age<nextSense)return;nextSense=age+(testNumber>=127?1.7:2.1);let nextSig=new Uint8Array(30*16);
 for(let a of agents){let ax=(a.id%6+.5)*W/6,ay=(Math.floor(a.id/6)+.5)*H/5,off=a.id*16,diff=0;
  for(let j=0;j<4;j++)for(let i=0;i<4;i++){let x=clamp(Math.floor(ax+(i-1.5)*W/27),0,W-1),y=clamp(Math.floor(ay+(j-1.5)*H/23),0,H-1),v=at(x,y);nextSig[off+j*4+i]=v;if(previous)diff+=Math.abs(v-previous[off+j*4+i]);}
  a.change=diff/16;a.repeat=a.change<.063?a.repeat+1:0;if(a.repeat>=3){a.next=Math.min(a.next,age+.5);a.goal=2;}
 }
 previous=nextSig;if(age>=nextFocus){let pool=agents.slice().sort((a,b)=>b.repeat-a.repeat);focus=pick(pool.slice(0,6)).id;nextFocus=age+range(13,29);}
 // Pigment is gradually consumed where material is rewritten; sparse erosion prevents accumulation.
 let colour=0;for(let i=0;i<field.length;i++)if(field[i]>1)colour++;
 if(colour>field.length*.035||random()<.45){let limit=Math.max(1,Math.floor(colour*.055));for(let n=0;n<field.length&&limit>0;n++){let i=R(field.length);if(field[i]>1){field[i]=1;limit--;}}}
}
function frame(t){let dt=last?Math.min(.1,(t-last)/1000):0;last=t;if(!paused&&!document.hidden){age+=dt;sense();if(age>=next){plan();next=age+range(.85,1.8);}evolve(dt);morph();advanceFronts();advanceSlips();advanceFlowPockets();updateMotionFields();if(!lastDraw||t-lastDraw>=33.333){draw();lastDraw=t;}if(q.has('debug'))document.getElementById('err').textContent='proposals '+trials+' accepted '+accepted+' completed '+finished+' rejected '+refusals+' inherited '+inherited+' pigment births '+colourBirths+' changed cells '+changes+' growth cells '+morphChanges+' exchanges '+flowChanges+' colonies '+colonyCount+' fronts '+frontCount+' front edits '+frontEdits+' local slips '+slipEvents+' shifted pairs '+slipPairs+' local flow events '+flowEvents+' flow cells '+flowCells+' 62C motion fields '+motionActive+' created '+motionEvents+' touched pixels '+motionTouched+' moved pixels '+motionMoved;}requestAnimationFrame(frame);}
