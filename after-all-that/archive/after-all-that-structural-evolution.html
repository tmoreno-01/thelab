<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>lifeafterlogic / Structural Evolution</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efeee9}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#err{position:fixed;left:10px;bottom:10px;color:#777;font:10px monospace;pointer-events:none}</style></head><body><canvas id="art"></canvas><div id="err"></div><script>
"use strict";
const q=new URLSearchParams(location.search),study=q.get('study')||'accretion',mode=study==='counterform'?1:study==='inheritance'?2:0;

const canvas=document.getElementById('art'),ctx=canvas.getContext('2d',{alpha:false}),small=document.createElement('canvas'),sc=small.getContext('2d',{alpha:false});

let trials=0,accepted=0,finished=0,colourBirths=0,inherited=0,refusals=0,changes=0,previous=null,focus=-1,nextFocus=0,colonies=[],morphChanges=0,flowChanges=0,colonyCount=0,nextMorph=0;

const binary=v=>v===0?0:1,at=(x,y)=>binary(field[clamp(y,0,H-1)*W+clamp(x,0,W-1)]);

function init(){
 field=new Uint8Array(W*H);active=[];agents=[];memory=[];colonies=[];nextMorph=0;used.clear();previous=null;age=next=nextSense=nextFocus=0;focus=-1;
 let a=new Int16Array(W),b=new Int16Array(H),c=new Int16Array(W),flip=R(2),base=range(.35,.62),sign=random()<.5?-1:1;
 function terrace(arr,size,center,slope){let v=size*center;for(let x=0;x<arr.length;){let len=3+R(Math.max(4,arr.length*.13));v=clamp(v*.44+(center+slope*(x/arr.length-.5))*size*.56+range(-size*.065,size*.065),size*.10,size*.90);for(let j=x;j<Math.min(arr.length,x+len);j++)arr[j]=Math.round(v);x+=len;}}
 terrace(a,H,base,sign*.48);terrace(b,W,range(.34,.67),-sign*.30);terrace(c,H,range(.65,.83),sign*.20);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){let v=mode===1?Number((x<b[y]&&y>a[x])||(x>=b[y]&&y<c[x])):Number((x<b[y])!==(y<a[x]));if(mode===2&&x>W*.09&&x<W*.86&&y>c[x]&&y<c[x]+H*.075)v=1-v;set(x,y,v^flip);}
 // Deliberate, interlocking ribs and recesses at multiple scales, not a tiled atlas.
 for(let i=0;i<(mode===1?12:19);i++){
  let x=R(W),y=a[x],direction=pick([-1,1]),depth=2+R(Math.max(3,H*.13)),len=4+R(Math.max(5,W*.28)),v=1-at(x,clamp(y+direction*depth,0,H-1)),pitch=2+R(3);
  for(let j=0;j<depth;j+=pitch){let n=Math.round(len*(1-j/depth*.68));for(let k=0;k<n;k++)set(x+k-Math.floor(len*.3),y+direction*j,v);}
 }
 for(let i=0;i<(mode===1?6:10);i++){
  let y=R(H),x=b[y],depth=3+R(Math.max(3,W*.07)),len=4+R(Math.max(5,H*.26)),dir=pick([-1,1]),v=1-at(clamp(x+dir*depth,0,W-1),y);
  for(let j=0;j<depth;j+=2+R(2))for(let k=0;k<len-Math.floor(j*.5);k++)set(x+dir*j,y+k-Math.floor(len*.3),v);
 }
 for(let j=0;j<30;j++)agents.push({id:j,next:range(0,10),reward:new Float32Array(10),count:new Uint16Array(10),recent:[],energy:range(.4,1),signature:[],repeat:0,goal:R(3),edge:0,change:0});
}
function resize(){
 let r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(2,Math.round(r.width*d));canvas.height=Math.max(2,Math.round(r.height*d));
 // Identical crisp lattice pitch in preview and fullscreen; preserve current state.
 let k=Math.min(1,(quality?2300:1500)/canvas.width,(quality?1400:950)/canvas.height),nw=Math.max(30,Math.round(canvas.width*k/5.07)),nh=Math.max(24,Math.round(canvas.height*k/5.07));
 if(nw===W&&nh===H){draw();return}
 let old=field,ow=W,oh=H;W=nw;H=nh;small.width=W;small.height=H;rgba=sc.createImageData(W,H);
 if(!old)init();else{field=new Uint8Array(W*H);for(let y=0;y<H;y++)for(let x=0;x<W;x++)field[y*W+x]=old[Math.min(oh-1,Math.floor(y*oh/H))*ow+Math.min(ow-1,Math.floor(x*ow/W))];active=[];colonies=[];previous=null;}

}
function draw(){
 if(!rgba)return;let p=rgba.data;for(let i=0;i<field.length;i++){let c=palette[field[i]]||palette[1],j=i*4;p[j]=c[0];p[j+1]=c[1];p[j+2]=c[2];p[j+3]=255;}
 sc.putImageData(rgba,0,0);ctx.imageSmoothingEnabled=false;ctx.drawImage(small,0,0,canvas.width,canvas.height);
}
function localStats(cx,cy,rad,overlay){
 let n=0,sum=0,e=0;const read=(x,y)=>{let j=clamp(y,0,H-1)*W+clamp(x,0,W-1);return binary(overlay?.has(j)?overlay.get(j):field[j]);};
 for(let y=Math.max(1,cy-rad);y<Math.min(H-1,cy+rad);y+=2)for(let x=Math.max(1,cx-rad);x<Math.min(W-1,cx+rad);x+=2){let v=read(x,y);sum+=v;e+=Math.abs(v-read(x+1,y))+Math.abs(v-read(x,y+1));n++;}

function anchor(agent){
 // Select a real edge from the evolving image, favour neglected areas and current goals.

 for(let i=0;i<80;i++){
  let x=clamp(Math.round(ax+range(-W*.13,W*.13)),1,W-2),y=clamp(Math.round(ay+range(-H*.17,H*.17)),1,H-2),gx=at(x+1,y)-at(x-1,y),gy=at(x,y+1)-at(x,y-1);
  if(!gx&&!gy)continue;
  let near=active.some(a=>Math.hypot(x-a.x,y-a.y)<a.radius*.8);if(near)continue;
  let v=range(0,.6)+(Math.abs(gx)+Math.abs(gy))*.13;if(!best||v>best.v)best={x,y,gx,gy,v};

}
function propose(agent,p,type,parent){
 let x=p.x,y=p.y,axis=parent?parent.axis:(Math.abs(p.gx)>Math.abs(p.gy)?1:0);if(random()<.22)axis=1-axis;
 let dir=pick([-1,1]),side=pick([-1,1]),length=Math.max(5,Math.round((axis?H:W)*range(.045,.22))),depth=Math.max(2,Math.round((axis?W:H)*range(.012,.075))),pitch=2+R(4),bend=1+R(5),tone=1-at(x,y);
 if(parent){pitch=parent.pitch;type=parent.type;depth=Math.max(2,Math.round(depth*parent.ratio));}

  for(let u=0;u<length;u++){let h=Math.max(1,Math.round(depth*(.28+.72*(1-Math.floor(u/Math.max(2,pitch*2))*pitch*2/length))));for(let v=0;v<h;v++)put(u,v,tone);}
 }else if(type===1){ // linked comb with irregular tooth lengths
  for(let u=0;u<length;u++){put(u,0,tone);if(u%pitch===0){let h=Math.max(2,Math.round(depth*(.28+.72*Math.abs(Math.sin(u*.13+bend)))));span(u,1,h,tone);}}
 }else if(type===2){ // recess: erase a corridor, leave a narrow rib
  for(let u=0;u<length;u++){let off=Math.floor(u/Math.max(3,pitch*2))*side;for(let v=0;v<depth;v++)if(v!==1||u%pitch===0)put(u,v+off,tone);}
 }else if(type===3){ // split a boundary into parallel offset seams
  for(let u=0;u<length;u++){let off=Math.floor(u/Math.max(3,pitch*3))*bend;put(u,off,tone);if(u%pitch!==0)put(u,off+depth,tone);if(u%Math.max(4,pitch*3)===0)span(u,off,depth,tone);}

 }else if(type===6){ // stepwise aperture, with nested teeth

  for(let v=0;v<depth;v+=pitch){let n=Math.max(2,Math.floor(length*(1-v/depth*.8)));for(let u=0;u<n;u++)put(u,v,tone);}

  for(let u=0;u<length;u++){if(u%pitch!==0)put(u,0,tone);if(u%pitch===0)span(u,-Math.floor(depth*.5),depth,tone);if(u>length*.52)put(u,Math.floor(depth*.5),tone);}
 }
 // Remove no-op cells and compare the actual proposed composition.
 order=order.filter(i=>binary(field[i])!==binary(map.get(i)));let overlay=new Map(order.map(i=>[i,map.get(i)]));
 let before=localStats(x,y,Math.max(7,Math.floor(radius*.55))),after=localStats(x,y,Math.max(7,Math.floor(radius*.55)),overlay);
 let desired=mode===1?.46:mode===2?.15:.10;

function plan(){
 let pool=agents.filter(a=>a.next<=age);if(!pool.length||active.length>=7)return;
 pool.sort((a,b)=>(b.repeat*.22+b.energy*.2+(b.id===focus?.2:0))-(a.repeat*.22+a.energy*.2+(a.id===focus?.2:0)));
 let a=null,p=null;for(let candidate of pool.slice(0,8)){let edge=anchor(candidate);candidate.next=age+range(2,9);if(edge){a=candidate;p=edge;break;}}if(!p)return;
 const types=mode===0?[0,1,3,4,5,7,8,9]:mode===1?[0,2,3,4,6,8]:[1,3,5,6,7,8,9];
 let candidates=[];
 for(let i=0;i<14;i++){
  let type=pick(types),parent=mode===2&&memory.length&&random()<.55?pick(memory.slice(-24)):null;
  if(parent&&a.recent.includes(parent.type))parent=null;
  let c=propose(a,p,type,parent);trials++;if(!a.recent.includes(c.type)&&c.score>-.15)candidates.push(c);else refusals++;
 }
 if(!candidates.length)return;candidates.sort((a,b)=>b.score-a.score);let c=candidates[0];
 used.add(c.key);if(used.size>25000)used.delete(used.values().next().value);
 a.recent.push(c.type);if(a.recent.length>Math.min(4,types.length-2))a.recent.shift();a.repeat=0;
 c.start=age;c.duration=range(2.5,9.5)*(mode===1?1.35:1);c.cursor=0;
 // Colour is a state of newly constructed dark material, not an animated overlay.
 if(c.tone===1&&c.score>.03&&(random()<(mode===1?.23:.38)||age-(a.lastColour??-30)>45)&&active.filter(x=>x.colour).length<1){c.colour=pick([2,3,4,5]);a.lastColour=age;colourBirths++;}
 if(c.parent)inherited++;active.push(c);accepted++;
 spawnColony(c);
}
function evolve(dt){
 for(let a of active){
  let progress=clamp((age-a.start)/a.duration,0,1);
  // Nonuniform construction cadence, interrupted by short rests.
  let work=progress<1?Math.min(.999,progress+Math.sin(progress*6.28)*.06):1;
  let end=Math.max(a.cursor,Math.floor(work*a.order.length));
  for(let k=a.cursor;k<end;k++){let i=a.order[k],v=a.overlay.get(i);if(v===1&&a.colour&&((k%a.pitch)<a.pitch-1))v=a.colour;if(field[i]!==v){field[i]=v;changes++;}}
  a.cursor=end;
  if(progress>=1){let d=a.agent,after=localStats(a.x,a.y,Math.max(7,Math.floor(a.radius*.55)));
   let target=mode===1?.07:mode===2?.20:.13,gain=Math.abs(a.before[1]-target)-Math.abs(after[1]-target);
   d.count[a.type]++;d.reward[a.type]+=(gain-d.reward[a.type])/Math.min(12,d.count[a.type]);d.energy=clamp(d.energy*.8+.2*(.5+gain*2),.15,1);d.goal=gain<-.04?0:after[1]<.05?2:1;
   if(gain>-.06){memory.push({type:a.type,pitch:a.pitch,axis:a.axis,ratio:clamp(a.depth/Math.max(2,a.length)*3,.5,1.7)});if(memory.length>100)memory.shift();}
   finished++;
   if(gain<-.035||after[1]>.26){let cl=colonies.find(z=>z.owner===a.key);if(cl){cl.rule=5;cl.end=Math.min(cl.end,age+6);}}
  }

}
// Growth is a consequence of construction, not a global animation.
function spawnColony(c){
 let rule=mode===0?pick([0,1,2,3,6]):mode===1?pick([1,4,5,7]):pick([0,2,3,6,7]);
 let a=c.agent;if(a.lastMorph===rule)rule=(rule+1+R(5))%8;a.lastMorph=rule;
 let radius=Math.max(4,Math.min(Math.round(Math.min(W,H)*.18),Math.floor(c.radius*.65)));
 colonies.push({owner:c.key,x:c.x,y:c.y,radius,rule,axis:c.axis,dir:c.dir,side:c.side,pitch:c.pitch,tone:c.tone,colour:c.colour,start:age+range(.6,2.6),end:age+range(10,24),cursor:0,phase:random(),energy:range(.5,.9),agent:a,visits:new Map()});

function morph(){
 if(age<nextMorph)return;nextMorph=age+.095;

 // Read a snapshot so local births/deaths are order-independent within each pass.
 if(!colonies.length)return;

  if(age<c.start)continue;

}
function sense(){
 if(age<nextSense)return;nextSense=age+2.1;let nextSig=new Uint8Array(30*16);
 for(let a of agents){let ax=(a.id%6+.5)*W/6,ay=(Math.floor(a.id/6)+.5)*H/5,off=a.id*16,diff=0;
  for(let j=0;j<4;j++)for(let i=0;i<4;i++){let x=clamp(Math.floor(ax+(i-1.5)*W/27),0,W-1),y=clamp(Math.floor(ay+(j-1.5)*H/23),0,H-1),v=at(x,y);nextSig[off+j*4+i]=v;if(previous)diff+=Math.abs(v-previous[off+j*4+i]);}
  a.change=diff/16;a.repeat=a.change<.063?a.repeat+1:0;if(a.repeat>=3){a.next=Math.min(a.next,age+.5);a.goal=2;}
 }

 // Pigment is gradually consumed where material is rewritten; sparse erosion prevents accumulation.
 let colour=0;for(let i=0;i<field.length;i++)if(field[i]>1)colour++;
 if(colour>field.length*.035||random()<.45){let limit=Math.max(1,Math.floor(colour*.055));for(let n=0;n<field.length&&limit>0;n++){let i=R(field.length);if(field[i]>1){field[i]=1;limit--;}}}
}
function frame(t){let dt=last?Math.min(.1,(t-last)/1000):0;last=t;if(!paused&&!document.hidden){age+=dt;sense();if(age>=next){plan();next=age+range(.45,1.35)*(mode===1?1.20:1);}evolve(dt);morph();draw();if(q.has('debug'))document.getElementById('err').textContent='proposals '+trials+' accepted '+accepted+' completed '+finished+' rejected '+refusals+' inherited '+inherited+' pigment births '+colourBirths+' changed cells '+changes+' growth cells '+morphChanges+' exchanges '+flowChanges+' colonies '+colonyCount;}requestAnimationFrame(frame);}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;if(e.data?.type==='study-visibility'){paused=!e.data.visible;last=0;}if(e.data?.type==='study-quality'){quality=!!e.data.full;resize();}});
new ResizeObserver(resize).observe(canvas);resize();requestAnimationFrame(frame);
