 const paletteFloats=new Float32Array(palette.flatMap(c=>c.map(x=>x/255)));
 let home=null,states=[],fbos=[],read=0,ready=false,tw=0,th=0;
 const regionData=new Float32Array(64),traitData=new Float32Array(64),geneData=new Float32Array(64);let atlasTex=null,atlasData=null,atlasScores=null,atlasW=0,atlasH=0;

 }

  gpuCanvas.width=canvas.width;gpuCanvas.height=canvas.height;
  if(W===tw&&H===th&&home)return;
  if(home)gl.deleteTexture(home);if(atlasTex)gl.deleteTexture(atlasTex);for(const t of states)gl.deleteTexture(t);for(const f of fbos)gl.deleteFramebuffer(f);
  tw=W;th=H;gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);atlasW=Math.ceil(W/32);atlasH=Math.ceil(H/32);atlasData=new Uint8Array(atlasW*atlasH*4);atlasScores=new Float32Array(atlasData.length);atlasTex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,atlasTex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,atlasW,atlasH,0,gl.RGBA,gl.UNSIGNED_BYTE,null);home=texture(gl.R8,gl.RED);states=[texture(gl.RGBA8,gl.RGBA),texture(gl.RGBA8,gl.RGBA)];fbos=states.map(t=>{const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw Error('Feedback framebuffer incomplete');return f;});gl.bindFramebuffer(gl.FRAMEBUFFER,null);read=0;ready=false;

   if(n>=16||amp<.015||area>=limit)return;
   const footprint=Math.PI*rx*ry/(W*H),scale=Math.min(1,Math.sqrt((limit-area)/Math.max(.00001,footprint)));if(scale<.55)return;rx*=scale;ry*=scale;area+=footprint*scale*scale;

  }

  }

   const x0=clamp(Math.floor((cx-r)/32),0,atlasW-1),x1=clamp(Math.floor((cx+r)/32),0,atlasW-1),y0=clamp(Math.floor((cy-r)/32),0,atlasH-1),y1=clamp(Math.floor((cy+r)/32),0,atlasH-1);

   }

}
