function spawnScribe(x,y,tribe,role){

function seedScribes(){

function updateScribes(dt){
 for(const s of scribes){
  if(!s.alive)continue;
  const x=s.x*W,y=s.y*H,aim=flow(x,y),bias=study==='impossible'?Math.sin(t*.17+s.phase)*.65:study==='civilisation'?(s.tribe-1.5)*.12:0;

   for(let i=0;i<3+R(7);i++){const a=s.a+between(-1.7,1.7),d=S*between(.003,.025);smallGlyph(worldCtx,s.x*W+Math.cos(a)*d,s.y*H+Math.sin(a)*d,S*between(.003,.009),a,ink,R(4))}
   if(random()<.28){const n=pick(nodes.filter(n=>n.alive&&n.tribe===s.tribe));if(n){const m=nearest(n);if(m&&Math.hypot((m.x-n.x)*W,(m.y-n.y)*H)<S*.2)edge(n,m,R(4))}}
  }

 scribes=scribes.filter(s=>s.alive);

}
function drawCurrent(){
 liveCtx.clearRect(0,0,W,H);
 for(const cl of clusters)if(cl.alive)membrane(liveCtx,cl);
 for(const f of fragments)drawFragment(liveCtx,f);
 for(const e of edges)if(e.alive!==false)drawEdge(liveCtx,e,false);
 for(const n of nodes)if(n.alive)drawNode(liveCtx,n,false);
 // Autonomous annotations emerge at joints, then drift away from their source.
 for(const n of nodes){if(n.age<2&&random()<.035){const x=n.x*W,y=n.y*H,s=S*between(.006,.018);liveCtx.save();liveCtx.translate(x,y);liveCtx.rotate(n.phase);liveCtx.strokeStyle=ink;liveCtx.lineWidth=Math.max(.7,S*.0009);liveCtx.beginPath();liveCtx.moveTo(-s,-s*.6);liveCtx.lineTo(-s,s*.6);liveCtx.lineTo(s*.5,s*.6);liveCtx.stroke();liveCtx.restore()}}
}
function trail(){
 worldCtx.save();worldCtx.globalAlpha=.028;worldCtx.fillStyle=paper;worldCtx.fillRect(0,0,W,H);worldCtx.restore();
 // Only the changing geometry is deposited into memory; no full-frame replay.
 worldCtx.save();worldCtx.globalAlpha=.16;
 for(const e of edges){if(e.alive===false)continue;const a=get(e.a),b=get(e.b);if(!a||!b)continue;worldCtx.strokeStyle=ink;worldCtx.lineWidth=Math.max(.5,e.width*.55);worldCtx.beginPath();worldCtx.moveTo(a.px*W,a.py*H);worldCtx.lineTo(b.px*W,b.py*H);worldCtx.stroke()}

}
function present(){
 if(!world)return;
 screen.imageSmoothingEnabled=true;screen.fillStyle=paper;screen.fillRect(0,0,canvas.width,canvas.height);
 screen.drawImage(world,0,0,canvas.width,canvas.height);screen.drawImage(live,0,0,canvas.width,canvas.height);
 screen.drawImage(pigment,0,0,canvas.width,canvas.height);
 screen.globalAlpha=.13;screen.drawImage(grain,0,0,canvas.width,canvas.height);screen.globalAlpha=1;
}
function nearest(n,tribe=null){
 let best=null,dist=Infinity;for(const m of nodes){if(m===n||!m.alive||(tribe!==null&&m.tribe!==tribe))continue;const d=Math.hypot((m.x-n.x)*W,(m.y-n.y)*H);if(d<dist){dist=d;best=m}}return best;

function prune(){
 if(nodes.length>290){const dead=nodes.filter(n=>!n.alive);for(const n of dead){nodeById.delete(n.id)}nodes=nodes.filter(n=>n.alive);edges=edges.filter(e=>e.alive!==false&&get(e.a)&&get(e.b))}

function addOffshoot(parent,angle,tribe=parent.tribe){

function splitEdge(e){

 const u=between(.22,.78),n=node(a.x+(b.x-a.x)*u+between(-.025,.025),a.y+(b.y-a.y)*u+between(-.025,.025),e.tribe,R(4),a.cluster);

function falseRepair(){
 if(edges.length<4)return;const e=pick(edges.filter(e=>e.alive!==false));if(!e)return;
 const a=get(e.a),b=get(e.b),c=nearest(a),d=nearest(b);if(!c||!d)return;
 edge(c,d,pick([1,2,3]));if(random()<.6)splitEdge(e);topologyCount++;
}
function misreadEvent(){
 const e=pick(edges.filter(e=>e.alive!==false));if(!e)return;
 const a=get(e.a),b=get(e.b),midX=(a.x+b.x)*.5,midY=(a.y+b.y)*.5,angle=Math.atan2(b.y-a.y,b.x-a.x)+pick([-1.2,-.72,.72,1.2,Math.PI/2]);
 const n=node(midX+Math.cos(angle)*between(.018,.07),midY+Math.sin(angle)*between(.018,.07),R(4),R(4),a.cluster);
 edge(a,n,R(4));if(random()<.8)edge(n,b,R(4));if(random()<.4)edge(n,nearest(n),R(4));if(random()<.35)splitEdge(pick(edges.filter(x=>x.alive!==false)));

function civilisationEvent(){
 const cl=pick(clusters),tribe=cl.tribe,front=pick(cl.hull.map(get).filter(n=>n&&n.alive));if(!front)return;

function foldEvent(){
 const cl=pick(clusters),ids=new Set(cl.hull.concat(cl.inner)),members=nodes.filter(n=>n.alive&&(n.cluster===cl.id||ids.has(n.id)));if(!members.length)return;
 const cx=members.reduce((v,n)=>v+n.x,0)/members.length,cy=members.reduce((v,n)=>v+n.y,0)/members.length,angle=pick([-.9,-.55,.55,.9,Math.PI/2]),scale=between(.72,1.28),mirror=random()<.3?-1:1;

function collapseEvent(){

function scaleMigration(){

function pigmentEvent(){

function rareEvent(){

function updateNodes(dt){
 const dt60=dt*60;
 const adjacency=new Map();for(const e of edges){if(e.alive===false)continue;let a=get(e.a),b=get(e.b);if(!a||!b)continue;if(!adjacency.has(a.id))adjacency.set(a.id,[]);if(!adjacency.has(b.id))adjacency.set(b.id,[]);adjacency.get(a.id).push(b);adjacency.get(b.id).push(a)}

  const angle=flow(n.x*W,n.y*H),fx=Math.cos(angle),fy=Math.sin(angle),neighbours=adjacency.get(n.id)||[];let sx=0,sy=0;

  n.vy=n.vy*.965+fy*drift+sy*spring+Math.cos(t*.33+n.phase)*.000018;

function grow(){
 if(nodes.length>260)return;
 if(study==='civilisation')civilisationEvent();
 else if(study==='impossible'){if(random()<.55)scaleMigration();else foldEvent()}
 else if(study==='extinction'){if(random()<.22)collapseEvent();else{const n=pick(nodes.filter(n=>n.alive));if(n)for(let i=0;i<3+R(4);i++)addOffshoot(n,random()*TAU,n.tribe)}}

function update(dt){
 t+=dt;frameNo++;updateNodes(dt);updateScribes(dt);
 // The past remains as physical residue; the present keeps moving above it.

 worldCtx.save();worldCtx.globalAlpha=.09;for(const e of edges){if(e.alive===false)continue;const a=get(e.a),b=get(e.b);if(!a||!b)continue;worldCtx.strokeStyle=ink;worldCtx.lineWidth=Math.max(.5,e.width*S*.35);worldCtx.beginPath();worldCtx.moveTo(a.px*W,a.py*H);worldCtx.lineTo(a.x*W,a.y*H);worldCtx.stroke()}worldCtx.restore();
 if(t>=nextEvent){rareEvent();nextEvent=t+between(.65,3.8)}

 if(t>=nextMemory){memories.push({t,frame:frameNo});if(memories.length>6)memories.shift();nextMemory=t+between(15,35)}
 for(const e of edges){if(e.pigment&&t>=e.pigment.end)e.pigment=null;if(e.alive!==false)e.age+=dt}

 if(study==='civilisation'&&t>12&&random()<dt*.15){const a=pick(clusters),b=pick(clusters.filter(c=>c!==a));if(a&&b){const x=pick(a.hull.map(get)),y=pick(b.hull.map(get));edge(x,y,2);a.power+=.05;b.power-=.03}}

function present(){
 if(!world||!live)return;
 screen.imageSmoothingEnabled=true;screen.fillStyle=paper;screen.fillRect(0,0,canvas.width,canvas.height);
 screen.drawImage(world,0,0,canvas.width,canvas.height);screen.drawImage(live,0,0,canvas.width,canvas.height);screen.drawImage(pigment,0,0,canvas.width,canvas.height);

function boot(){

}
let resizeTimer;
new ResizeObserver(()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(resize,120)}).observe(canvas);
window.addEventListener('message',e=>{
 if(e.origin!==location.origin||e.source!==parent)return;
 if(e.data?.type==='study-visibility'){paused=!e.data.visible;last=0;acc=0}
 if(e.data?.type==='study-quality'){const v=!!e.data.fullscreen;if(v!==full){full=v;clearTimeout(resizeTimer);resizeTimer=setTimeout(resize,120)}}
});
document.addEventListener('visibilitychange',()=>{last=0});
function loop(now){
