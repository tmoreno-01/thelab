function addFull(a,target,url){const btn=document.createElement('button');btn.type='button';btn.className='study-full';btn.textContent='Fullscreen ⛶';btn.onclick=async()=>{const fn=target.requestFullscreen||target.webkitRequestFullscreen;if(!fn){location.href=url;return}try{await fn.call(target)}catch(e){location.href=url}};a.append(btn)}
function card(s){let a=document.createElement('article'),c=document.createElement('canvas'),link=document.createElement('a');c.setAttribute('aria-label',s.name);link.textContent=s.name+' ↗';link.href='?study='+s.id;link.target='_blank';link.rel='noopener';a.append(c,link);addFull(a,c,link.href);root.append(a);return c}
let tickers=[];
if(solo){document.body.classList.add('solo');document.title='lifeafterlogic / '+solo.name;let c=document.createElement('canvas');root.append(c);tickers.push(engine(c,solo,styles.indexOf(solo)))}
else{
 document.title='lifeafterlogic / living print studies';document.querySelector('header').hidden=false;

 const old=document.getElementById('legacy');old.hidden=false;let list=[['07 — Broken Logic (v4)','geometry'],['08 — Physical Memory (v4)','memory'],['09 — Unknown Language (v4)','language']];
 const watch=new IntersectionObserver(entries=>{for(let e of entries){let p=e.target;p.dataset.visible=e.isIntersecting?'1':'0';let f=p.querySelector('iframe');const send=()=>{const current=p.querySelector('iframe');if(current&&current.contentWindow){let full=document.fullscreenElement||document.webkitFullscreenElement;current.contentWindow.postMessage({type:'study-visibility',visible:full?full===p:p.dataset.visible==='1'},location.origin);current.contentWindow.postMessage({type:'study-quality',fullscreen:full===p},location.origin)}};if(e.isIntersecting&&!f){f=document.createElement('iframe');f.title=p.dataset.label;f.src='./index.html?study='+p.dataset.study+'&v=4';f.loading='lazy';f.addEventListener('load',send);p.append(f)}else if(f)send()}},{rootMargin:'20px'});
 for(let [name,id] of list){let a=document.createElement('article'),p=document.createElement('div'),l=document.createElement('a');p.className='oldframe';p.dataset.study=id;p.dataset.label=name;l.textContent=name+' ↗';l.href='./index.html?study='+id+'&v=4';l.target='_blank';l.rel='noopener';a.append(p,l);addFull(a,p,l.href);old.querySelector('.grid').append(a);watch.observe(p)}
}
function syncLegacyQuality(){let full=document.fullscreenElement||document.webkitFullscreenElement;document.querySelectorAll('.oldframe').forEach(p=>{let f=p.querySelector('iframe');if(f&&f.contentWindow){f.contentWindow.postMessage({type:'study-quality',fullscreen:full===p},location.origin);f.contentWindow.postMessage({type:'study-visibility',visible:full?full===p:p.dataset.visible==='1'},location.origin)}})}
