 boxes=boxes.filter(box=>box.w>0&&box.h>0);
 // Regenerate full-resolution ownership and genes; do not replace the live feedback.
 for(const box of boxes){genome(box);for(let y=H-box.y-box.h;y<H-box.y;y++)for(let x=box.x;x<box.x+box.w;x++){let i=(y*W+x)*4;fieldData[i]=box.id;fieldData[i+1]=box.gene;fieldData[i+2]=box.speed;fieldData[i+3]=box.porosity}}
 fb=targets.map(t=>{let f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);return f});
 
 // Future local rewrites now generate native-resolution details instead of enlarging pixels.
 draw();
}
function fitArt(){
 const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
 const w=Math.max(2,Math.round(r.width*d)),h=Math.max(2,Math.round(r.height*d));
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}
 if(targets.length){const [nw,nh]=resolutionFor(w,h,!preview||fullQuality);resizeSimulation(nw,nh);draw()}
}

let timer;new ResizeObserver(()=>{clearTimeout(timer);timer=setTimeout(fitArt,120)}).observe(canvas);
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===parent&&e.data?.type==='study-quality'){fullQuality=!!e.data.fullscreen;clearTimeout(timer);timer=setTimeout(fitArt,100)}});

 sourceImages=(await Promise.all(pending)).filter(Boolean);
 try{rebuild(true);requestAnimationFrame(frame)}catch(e){el('err').textContent=e.message;throw e}
}
