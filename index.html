<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>lab — LifeAfterLogic</title>
<meta name="description" content="Experiments in moving image, generative visuals, interactive space and emerging creative technology by LifeAfterLogic.">
<link rel="icon" type="image/svg+xml" href="./media/lifeafterlogic-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{font-family:"Poppins","Helvetica Neue",Helvetica,Arial,sans-serif;color:#111;background:#fff;font-synthesis:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:#fff}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:1px solid currentColor;outline-offset:5px}
.header{height:82px;padding:0 clamp(20px,3.1vw,48px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ececec}
.brand{display:inline-flex;align-items:center;gap:10px;min-height:44px}
.brand img{width:30px;height:30px;display:block;flex:none}
.brand span{font-size:21px;line-height:1;font-weight:700;letter-spacing:-.065em}
.header-link{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#777}
main{max-width:1800px;margin:0 auto;padding:12px clamp(20px,3.1vw,48px) 56px}
.project-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.project-tile{position:relative;isolation:isolate;display:block;overflow:hidden;aspect-ratio:2.45/1;background:#17191b;color:#fff}
.project-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform 650ms cubic-bezier(.22,1,.36,1),filter 450ms ease}
.project-tile::after{content:"";position:absolute;z-index:1;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12) 0%,rgba(0,0,0,.03) 36%,rgba(0,0,0,.68) 100%);pointer-events:none}
.tile-top{position:absolute;z-index:2;top:13px;left:15px;right:15px;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.tile-title{position:absolute;z-index:2;left:15px;right:15px;bottom:13px;margin:0;font-size:clamp(15px,1.55vw,23px);font-weight:500;letter-spacing:-.055em;line-height:1.1}
@media(hover:hover){.project-tile:hover img{transform:scale(1.045);filter:saturate(1.08)}}
.project-tile:focus-visible::after{background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.78))}
.archive{margin-top:clamp(54px,7vw,92px);padding-top:20px;border-top:1px solid #e8e8e8}.archive-heading{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:26px}.archive-eyebrow,.archive-label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#999}.archive-title{font-size:clamp(24px,3vw,34px);line-height:1.05;letter-spacing:-.065em;font-weight:400;margin:8px 0 0}.archive-intro{max-width:380px;margin:0;color:#888;font-size:11px;line-height:1.7}.archive-group+.archive-group{margin-top:28px}.archive-label{margin-bottom:9px}.archive-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.archive-link{min-width:0;display:flex;flex-direction:column;gap:5px;padding:12px 13px;border:1px solid #e9e9e9;min-height:86px;transition:background 180ms ease,border-color 180ms ease}.archive-link:hover{background:#f8f8f8;border-color:#bbb}.archive-version{font-size:9px;letter-spacing:.08em;color:#999;text-transform:uppercase}.archive-link strong{font-size:13px;line-height:1.25;font-weight:500;letter-spacing:-.025em}.archive-detail{font-size:10px;line-height:1.5;color:#999}footer{padding-top:44px;color:#999;font-size:10px;letter-spacing:.09em;text-transform:uppercase}
@media(max-width:980px){.project-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.archive-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.header{height:72px}.brand img{width:28px;height:28px}.brand span{font-size:20px}.header-link{font-size:9px}main{padding-top:16px}.project-grid{grid-template-columns:1fr;gap:9px}.project-tile{aspect-ratio:2.7/1;min-height:132px}.tile-title{font-size:19px}.archive-heading{display:block}.archive-intro{margin-top:12px}.archive-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.archive-link{padding:10px;min-height:92px}.archive-link strong{font-size:12px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.project-tile img{transition:none}}
</style>
</head>
<body>
<header class="header">
 <a class="brand" href="./" aria-label="LifeAfterLogic lab home"><img src="./media/lifeafterlogic-mark.svg" width="30" height="30" alt=""><span>lab</span></a>
 </header>
<main>
 <section class="project-grid" aria-label="LifeAfterLogic projects">
  <a class="project-tile" href="4d-splats/" aria-label="4D Splat Studio — animated Gaussian reconstructions">
   <img src="./media/4d-splats-preview.svg" alt="" loading="lazy" decoding="async">
   <div class="tile-top">001</div>
   <h2 class="tile-title">4D Splat Studio</h2>
  </a>
  <a class="project-tile" href="room/" aria-label="Room — interactive path-traced interior">
   <img src="./media/room-preview.svg" alt="" loading="lazy" decoding="async">
   <div class="tile-top">002</div>
   <h2 class="tile-title">Room</h2>
  </a>
  <a class="project-tile" href="anima.html" aria-label="Anima — artificial life experiment">
   <img src="./media/anima-preview.svg" alt="" loading="lazy" decoding="async">
   <div class="tile-top">003</div>
   <h2 class="tile-title">Anima</h2>
  </a>
  <a class="project-tile" href="palimpsest/" aria-label="Palimpsest — persistent computational ink drawing">
   <img src="./palimpsest/preview-012.svg" alt="" loading="lazy" decoding="async">
   <div class="tile-top">004</div>
   <h2 class="tile-title">Palimpsest</h2>
  </a>
  <a class="project-tile" href="field-studies/" aria-label="Field Studies — moving pigment archive">
   <img src="./media/field-studies-012-flowers.jpg" alt="" loading="lazy" decoding="async">
   <div class="tile-top">005</div>
   <h2 class="tile-title">Field Studies</h2>
  </a>
 <a class="project-tile" href="reset/" aria-label="reset"><img src="./media/reset-preview.svg" alt="" loading="lazy" decoding="async"><div class="tile-top">006</div><h2 class="tile-title">reset</h2></a>
</section>

 <footer>THE LAB — LIFEAFTERLOGIC</footer>
</main>
</body>
</html>
