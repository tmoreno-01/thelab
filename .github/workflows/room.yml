name: Build interactive MuTracer room
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/room-src/**'
      - '.github/workflows/room.yml'
permissions:
  contents: write
concurrency:
  group: room-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experiments/room-src
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Fetch CC0 materials and models
        run: python3 assets.py
      - name: Install and bundle renderer
        run: |
          npm install --no-save three@0.185.1 @meimu/mutracer@0.1.5 vite@7.2.2 playwright-core
          node --input-type=module -e "import * as M from '@meimu/mutracer'; if(!M.THREESync||!M.Engine||!M.RenderLoop)throw Error('MuTracer API mismatch')"
          npx vite build --base ./ --outDir /tmp/room-dist
      - name: Browser smoke test
        run: |
          python3 -m http.server 8765 --directory /tmp/room-dist >/tmp/room-http.log 2>&1 &
          node --input-type=module <<'JS'
          import {chromium} from 'playwright-core';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage']});
          try{
            const page=await browser.newPage({viewport:{width:320,height:210},deviceScaleFactor:1});
            const errors=[]; page.on('pageerror',e=>{errors.push(String(e));console.log('Page error',String(e))});
            page.on('console',m=>{if(m.type()==='error')console.log(m.text())});
            await page.goto('http://localhost:8765');
            await page.waitForFunction(()=>window.roomTest||document.querySelector('#loading').textContent.includes('could not start'),{},{timeout:120000});
            const state=await page.evaluate(()=>({ready:!!window.roomTest,loading:document.querySelector('#loading').textContent,count:window.roomTest?.objects.length,missing:window.roomTest?.missing}));
            console.log(JSON.stringify(state));
            if(!state.ready||state.count<15||state.missing?.some(x=>['leather armchair','stone coffee table'].includes(x)))throw Error('Room initialization or critical asset load failed');
            const tested=await page.evaluate(()=>{
              const r=window.roomTest,g=r.objects.find(x=>x.name==='leather armchair'),before=g.rotation.y;
              r.select(g);document.querySelector('#right').click();
              const rotated=Math.abs(g.rotation.y-before-Math.PI/12)<1e-5;
              document.querySelector('#up').click();
              const lifted=Math.abs(g.position.y-g.userData.home.p.y-.075)<1e-5;
              document.querySelector('#reset').click();
              const reset=g.position.distanceTo(g.userData.home.p)<1e-5&&g.quaternion.angleTo(g.userData.home.q)<1e-5;
              return {rotated,lifted,reset};
            });
            console.log('Interaction checks: '+JSON.stringify(tested));
            if(!Object.values(tested).every(Boolean)||errors.length)throw Error('Interaction or browser error: '+errors.join('; '));
            await page.waitForTimeout(2500);
            if(errors.length)throw Error(errors.join('; '));
            try {await page.screenshot({path:'/tmp/room-smoke.png',timeout:15000});}
            catch(e){if(e.name!=='TimeoutError')throw e;console.log('Optional screenshot timed out on software GPU; scene initialization and interaction tests passed.');}
            if(errors.length)throw Error(errors.join('; '));
          }finally{await browser.close()}
          JS
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: room-browser-preview
          path: /tmp/room-smoke.png
          if-no-files-found: ignore
      - name: Publish built experiment
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf room
            mkdir room
            cp -a /tmp/room-dist/. room/
            python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'href="room/"' not in s:
              s=s.replace('<main>', '<main><a href="room/" style="display:block;padding:17px 0 21px;margin-bottom:22px;border-top:1px solid #ddd;border-bottom:1px solid #ddd;text-decoration:none;font-size:21px;letter-spacing:-.045em">room / 001 <span style="font-size:12px;letter-spacing:0;color:#666">— interactive MuTracer interior ↗</span></a>',1)
              p.write_text(s)
          PY
            git add room index.html
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish interactive MuTracer room"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
