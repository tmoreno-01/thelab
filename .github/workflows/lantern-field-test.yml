name: Lantern Field browser smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - 'lanterns/**'
      - 'media/lantern-field-preview.svg'
      - 'index.html'
      - '.github/workflows/lantern-field-test.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test driver
        run: npm install --no-save playwright-core
      - name: Serve lab and test real-time neural lantern rendering
        run: |
          python3 -m http.server 8000 >/tmp/lantern-http.log 2>&1 &
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage']});
          try {
            const page=await browser.newPage({viewport:{width:1280,height:800},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('http://127.0.0.1:8000/lanterns/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>document.querySelector('#loader')?.classList.contains('done')||document.querySelector('#error')?.textContent.trim(),{},{timeout:90000});
            const errorText=(await page.locator('#error').textContent()).trim();
            if(errorText)throw Error(errorText);
            if(!(await page.locator('canvas').count()))throw Error('No WebGL canvas was created');
            await page.screenshot({path:'lantern-field-smoke.png'});
            console.log('Initial: '+await page.locator('#meta').textContent());
            await page.locator('#pause').click();
            if(await page.locator('#pause').textContent()!=='play')throw Error('Pause control did not toggle');
            await page.locator('#pause').click();
            await page.mouse.move(640,400);await page.mouse.down();await page.mouse.move(690,430,{steps:3});await page.mouse.up();
            await page.locator('#glow').evaluate(el=>{el.value='1.3';el.dispatchEvent(new Event('input',{bubbles:true}))});
            if(errors.length)throw Error(errors.join('\\n'));
            console.log('Neural weights loaded, WebGL shaders compiled, lantern field rendered, orbit/pause/glow controls passed.');
          } finally {await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lantern-field-browser-preview
          path: lantern-field-smoke.png
