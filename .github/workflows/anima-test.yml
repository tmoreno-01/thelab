name: ANIMA browser smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - 'anima.html'
      - '.github/workflows/anima-test.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test driver
        run: npm install --no-save playwright-core
      - name: Compile shaders and exercise interaction
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          import { pathToFileURL } from 'node:url';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage']});
          try {
            const page=await browser.newPage({viewport:{width:720,height:480},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(pathToFileURL(process.cwd()+'/anima.html').href);
            await page.waitForFunction(()=>document.querySelector('#error').textContent.includes('could not start')||document.querySelector('#meta').textContent.includes('FPS'),{},{timeout:90000});
            const state=await page.locator('#error').textContent();
            if(state.trim())throw Error(state);
            await page.screenshot({path:'anima-smoke.png'});
            console.log('Initial: '+await page.locator('#meta').textContent());
            await page.locator('#new').click();
            await page.locator('#pause').click();
            await page.waitForTimeout(200);
            if(await page.locator('#pause').textContent()!=='resume')throw Error('Pause did not work');
            await page.locator('#pause').click();
            await page.mouse.move(360,240);await page.mouse.down();await page.mouse.move(400,260,{steps:3});await page.mouse.up();
            if(errors.length)throw Error(errors.join('\n'));
            if((await page.locator('#error').textContent()).trim())throw Error('Render error after interaction');
            console.log('ANIMA shader compilation, live rendering, reseed, pause and orbit passed.');
          } finally {await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anima-browser-preview
          path: anima-smoke.png
