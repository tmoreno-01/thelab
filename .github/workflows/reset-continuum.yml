name: Validate RESET 023–025
on:
  push:
    paths:
      - 'reset/versions/v.02/continuum.html'
      - 'reset/versions/v.02/index.html'
      - '.github/workflows/reset-continuum.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save playwright
          npx playwright install chromium
          python3 -m http.server 8765 &
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const b=await chromium.launch({args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            const root='http://127.0.0.1:8765/reset/versions/v.02/';
            try {
              for(const [study,layout] of [[23,'columns'],[24,'territories'],[25,'continuous'],[25,'crossroads'],[24,'monolith'],[23,'interlace']]){
                const p=await b.newPage({viewport:{width:850,height:650}}),errors=[];
                p.on('pageerror',e=>errors.push(e.message));
                await p.goto(root+'continuum.html#study='+study+'&layout='+layout+'&seed=4291&colour=1&preview=1');
                await p.waitForFunction(()=>window.__resetDiagnostics?.().frames>6);
                const d=await p.evaluate(()=>window.__resetDiagnostics());
                assert.equal(d.gpu,true,JSON.stringify(d));assert.equal(d.study,study);
                assert.ok(d.motionFamilies.length>=Math.min(6,d.modules),JSON.stringify(d));
                assert.ok(d.motionFamilies.includes(0)&&d.motionFamilies.includes(2));
                assert.ok(d.matterCount>0);assert.equal(d.matterCount,d.matterLive);
                const first=await p.screenshot();
                await p.waitForTimeout(2500);
                await p.waitForFunction(()=>window.__resetDiagnostics().contactPushes>0,{},{timeout:30000});
                const after=await p.evaluate(()=>window.__resetDiagnostics());assert.equal(after.matterCount,after.matterLive);assert.ok(after.longestPush>=2);
                const later=await p.screenshot({path:'/tmp/reset-'+study+'-'+layout+'.png'});
                assert.notDeepEqual(first,later);
                assert.deepEqual(errors,[]);
                console.log(study,layout,d.motionFamilies,d.motionArea);
                await p.close();
              }
              const p=await b.newPage({viewport:{width:1200,height:800}});
              await p.goto(root+'index.html#round-9');
              assert.deepEqual(await p.locator('.tile').evaluateAll(t=>t.map(e=>e.dataset.number)),['23','24','25']);
              await p.locator('[data-round="6"]').click();
              assert.deepEqual(await p.locator('.tile').evaluateAll(t=>t.map(e=>e.dataset.number)),['19','19','19']);
              await p.locator('[data-round="7"]').click();
              assert.deepEqual(await p.locator('.tile').evaluateAll(t=>t.map(e=>e.dataset.number)),['20','21','22']);
              await p.locator('[data-round="8"]').click();
              assert.deepEqual(await p.locator('.tile').evaluateAll(t=>t.map(e=>e.dataset.number)),['23','24','25']);
              await p.close();
            }finally{await b.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: reset-continuum-previews
          path: /tmp/reset-*.png
