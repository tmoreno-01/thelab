<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>Palimpsest — LifeAfterLogic Lab</title>
<link rel="icon" href="../media/lifeafterlogic-mark.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#111;font:14px/1.5 "Poppins",Helvetica,Arial,sans-serif}header{height:82px;padding:0 clamp(20px,3.1vw,48px);display:flex;align-items:center;border-bottom:1px solid #ececec}a{color:inherit;text-decoration:none}.brand{display:inline-flex;align-items:center;gap:10px;font-size:21px;font-weight:700;letter-spacing:-.065em}.brand img{width:30px;height:30px;display:block}main{max-width:1500px;margin:auto;padding:24px clamp(20px,3.1vw,48px) 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}h1{font-size:clamp(25px,4vw,42px);font-weight:500;letter-spacing:-.065em;margin:0}button{font:inherit;color:inherit;background:none;border:1px solid #ccc;padding:7px 14px;cursor:pointer}button[aria-pressed=true]{background:#111;color:#fff;border-color:#111}button:focus-visible,a:focus-visible{outline:2px solid #111;outline-offset:3px}.versions,.controls{display:flex;gap:6px;flex-wrap:wrap}.stage{background:#eeeae0;display:grid;place-items:center;min-height:160px}.stage canvas,.stage video{display:block;width:auto;max-width:100%;height:auto;max-height:76vh;object-fit:contain;aspect-ratio:1}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid #e4e4e4}.status{font-size:11px;color:#777;font-variant-numeric:tabular-nums}.note{font-size:12px;line-height:1.7;color:#666;max-width:700px;margin:18px 0}.note a{text-decoration:underline;text-underline-offset:3px}[hidden]{display:none!important}@media(max-width:620px){header{height:72px}main{padding-top:16px}.stage canvas,.stage video{width:100%;max-height:none}.bar button{padding:6px 10px;font-size:11px}}
</style></head><body><header><a class="brand" href="../" aria-label="Lab home"><img src="../media/lifeafterlogic-mark.svg" alt=""><span>lab</span></a></header><main>
<div class="top"><h1>Palimpsest</h1><div class="versions" aria-label="Drawing versions"><button id="v3" aria-pressed="true">003</button><button id="v2" aria-pressed="false">002</button><button id="v1" aria-pressed="false">001</button></div></div>
<div class="stage" id="stage"><canvas id="paper" aria-label="Living ink drawing, portrait evolving into architecture and a bird"></canvas></div>
<div class="bar"><span id="status" class="status">003 / initialising</span><div class="controls" id="controls"><button id="pause">Pause</button><button id="step">Next frame</button><button id="restart">New drawing</button></div></div>
<p class="note" id="note">003 — a continuous, adaptive drawing. The composition evolves through inherited contours, local ink density, changing motifs and correction strokes. Every new drawing has a different seed. No fixed ending. <a href="./ink-003.js">Engine source</a>.</p>
</main><script src="./ink-003.js"></script><script>
"use strict";
const stage=document.getElementById("stage"),canvas=document.getElementById("paper"),status=document.getElementById("status"),note=document.getElementById("note"),controls=document.getElementById("controls"),pause=document.getElementById("pause"),restart=document.getElementById("restart");
const buttons=[1,2,3].map(n=>document.getElementById("v"+n)),engines={},canvases={3:canvas,2:document.createElement("canvas")};
const descriptions={3:note.innerHTML,2:'002 — the fixed 43-second portrait, bird and architecture drawing score. <a href="./ink-002.js">Engine source</a>.',1:'001 — original procedural patch and pigment test.'};
let engine,video=null,mode=3,playing=!matchMedia("(prefers-reduced-motion: reduce)").matches,last=0,acc=0,busy=false;
let v2Promise;
function seed(){return crypto.getRandomValues(new Uint32Array(1))[0];}
function load2(){if(window.Palimpsest002)return Promise.resolve();if(!v2Promise)v2Promise=new Promise((res,rej)=>{const s=document.createElement("script");s.src="./ink-002.js";s.onload=res;s.onerror=()=>{v2Promise=null;s.remove();rej(Error("002 failed to load"));};document.head.append(s);});return v2Promise;}
function update(){if(mode===1||!engine)return;const t=engine.seconds;status.textContent=mode===3?"003 / "+Math.floor(t/60)+":"+String(Math.floor(t)%60).padStart(2,"0")+" · seed "+engine.seed+" · "+engine.stats.marks+" new marks":"002 / "+engine.frame+" / 516 frames · "+t.toFixed(1)+" s";pause.textContent=playing?"Pause":"Play";}
function frame(t){requestAnimationFrame(frame);if(!last)last=t;const dt=Math.min(200,t-last);last=t;if(mode===1||!playing||busy||document.hidden||!engine)return;acc+=dt;let change=false;while(acc>=1000/12){acc-=1000/12;if(!engine.step()){playing=false;break;}change=true;}if(change||!playing)update();}
async function show(n){if(busy||n===mode)return;busy=true;playing=false;try{if(n===2){await load2();if(!engines[2])engines[2]=Palimpsest002.create(canvases[2]);}if(video){video.pause();video.removeAttribute("src");video.load();video.remove();video=null;}mode=n;buttons.forEach((b,i)=>b.setAttribute("aria-pressed",String(i+1===n)));note.innerHTML=descriptions[n];if(n===1){engine=null;controls.hidden=true;video=document.createElement("video");video.controls=true;video.loop=true;video.muted=true;video.playsInline=true;video.preload="none";video.poster="./palimpsest-001.jpg";video.src="./palimpsest-001.mp4";stage.replaceChildren(video);video.play().catch(()=>{});status.textContent="001 / original 8-second render";}else{engine=engines[n];stage.replaceChildren(canvases[n]);controls.hidden=false;restart.textContent=n===3?"New drawing":"Replay";playing=!engine.finished;acc=0;update();}}catch(e){status.textContent=e.message;}finally{busy=false;}}
try{engine=engines[3]=Palimpsest003.create(canvas,seed());update();requestAnimationFrame(frame);buttons.forEach((b,i)=>b.onclick=()=>show(i+1));pause.onclick=()=>{if(!engine)return;if(engine.finished){engine.reset();playing=true;}else playing=!playing;acc=0;update();};document.getElementById("step").onclick=()=>{if(!engine)return;playing=false;engine.step();update();};restart.onclick=()=>{if(!engine)return;if(mode===3)engine.reset(seed());else engine.reset();playing=true;acc=0;update();};document.addEventListener("visibilitychange",()=>{last=0;acc=0;if(document.hidden&&video)video.pause();});}catch(e){status.textContent="003 could not start: "+e.message;console.error(e);}
</script></body></html>
