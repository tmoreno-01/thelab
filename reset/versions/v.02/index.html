<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>RESET — v.02 / 019</title>
<style>
*{box-sizing:border-box}
html{background:#fff;color:#111;font:13px Arial,sans-serif}
body{margin:0;min-height:100vh}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid #eee}
header .brand{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:bold}
header .brand img{width:26px;height:26px}
header .edition{color:#888;font-size:11px;letter-spacing:.12em}
.version-back{margin-left:auto;display:inline-flex;align-items:center;min-height:34px;padding:0 12px;border:1px solid #ddd;font-size:10px;letter-spacing:.11em}
.version-back:hover{background:#f4f4f2;text-decoration:none;border-color:#aaa}
main{max-width:1800px;margin:auto;padding:28px 24px 54px}
.intro{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}
.intro h1{font-size:12px;font-weight:normal;letter-spacing:.17em;text-transform:uppercase;color:#777;margin:0}
.intro p{font-size:11px;color:#999;margin:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tile{min-width:0;cursor:pointer;outline:none}
.screen{position:relative;overflow:hidden;aspect-ratio:16/10;background:#050505;border:1px solid #e8e8e8}
.screen iframe{display:block;width:100%;height:100%;border:0;pointer-events:none}
.tile:focus-visible .screen{outline:2px solid #111;outline-offset:3px}
.number{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 1px 0;color:#111;font-size:10px;letter-spacing:.11em}
.number span:last-child{color:#aaa;font-size:9px;letter-spacing:.08em;white-space:nowrap}
.reseed{border:0;background:transparent;padding:0;color:#999;font:inherit;font-size:9px;letter-spacing:.08em;white-space:nowrap;cursor:pointer}
.reseed:hover{color:#111}
.tile:fullscreen{width:100vw;height:100vh;background:#050505;padding:16px;display:flex;flex-direction:column;gap:10px}
.tile:fullscreen .screen{flex:1;min-height:0;aspect-ratio:auto;border:0}
.tile:fullscreen .number{padding:0;flex:0 0 auto;color:#fff}
.tile:fullscreen .number span:last-child{color:#888}
.history{margin-top:34px;padding-top:17px;border-top:1px solid #e9e9e9}
.history-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:12px}
.history-head h2{font-size:10px;font-weight:normal;letter-spacing:.15em;text-transform:uppercase;color:#999;margin:0}
.history-head a{font-size:10px;color:#777}
.history-list{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
.history-item{min-width:0;display:flex;flex-direction:column;gap:7px;padding:11px 10px;border:1px solid #e8e8e8;transition:background .16s,border-color .16s}
.history-item:hover{background:#f7f7f5;border-color:#bbb;text-decoration:none}
.history-no{font-size:10px;letter-spacing:.13em;color:#999}
.history-name{font-size:10px;line-height:1.4;letter-spacing:.04em;color:#333}
@media(max-width:900px){main{padding:22px 16px 40px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.history-list{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:540px){header{padding:12px;gap:10px}.edition{display:none}main{padding:20px 12px 34px}.grid{grid-template-columns:1fr;gap:19px}.screen{aspect-ratio:16/9}.intro{align-items:flex-start;flex-direction:column;gap:7px}.history-list{grid-template-columns:repeat(3,minmax(0,1fr))}.history-item{padding:9px 8px}.history-name{font-size:9px}.version-back{font-size:9px;padding:0 8px}}
.history-list{display:flex;flex-wrap:wrap;gap:7px}.history-item{font:inherit;cursor:pointer;background:white;text-align:left;min-width:105px;flex:0 0 auto}.history-item[aria-pressed=true]{background:#111;border-color:#111;color:#fff}.history-item[aria-pressed=true] .history-no,.history-item[aria-pressed=true] .history-name{color:#fff}.history-item:focus-visible{outline:2px solid #111;outline-offset:2px}
.screen{position:relative}.screen iframe[data-pending]{visibility:hidden}.preview-status{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#aaa;font-size:10px;letter-spacing:.08em;pointer-events:none}.preview-status[hidden]{display:none}
</style>
</head>
<body>
<header>
 <a class="brand" href="../../../"><img src="../../../media/lifeafterlogic-mark.svg" alt="">lab</a>
 <span class="edition">RESET / v.02</span>
 <a class="version-back" href="../../index.html">ALL RESET VERSIONS ↗</a>
</header>
<main>
 <div class="intro">
  <h1>RESET / v.02 — New studies</h1>
  <p>Fresh seed on every load · continuous currents · living pigment · evolving structural grammar</p>
 </div>
 <section class="grid" aria-label="RESET study 019">
  <article class="tile" tabindex="0" role="button" aria-label="Open study 016 Axial Drift fullscreen" data-study="16">
   <div class="screen"><iframe title="RESET 016 — Axial Drift" loading="lazy" allowfullscreen></iframe></div>
   <div class="number"><span>016 — AXIAL DRIFT</span><button class="reseed" type="button">NEW SEED ↻</button><span>FULLSCREEN ↗</span></div>
  </article>
  <article class="tile" tabindex="0" role="button" aria-label="Open study 017 Fracture Atlas fullscreen" data-study="17">
   <div class="screen"><iframe title="RESET 017 — Fracture Atlas" loading="lazy" allowfullscreen></iframe></div>
   <div class="number"><span>017 — FRACTURE ATLAS</span><button class="reseed" type="button">NEW SEED ↻</button><span>FULLSCREEN ↗</span></div>
  </article>
  <article class="tile" tabindex="0" role="button" aria-label="Open study 018 Common Current fullscreen" data-study="18">
   <div class="screen"><iframe title="RESET 018 — Common Current" loading="lazy" allowfullscreen></iframe></div>
   <div class="number"><span>018 — COMMON CURRENT</span><button class="reseed" type="button">NEW SEED ↻</button><span>FULLSCREEN ↗</span></div>
  </article>
 </section>
 <nav class="history" aria-label="Previous RESET studies">
  <div class="history-head"><h2>Study rounds</h2><a href="./archive.html">Expanded archive ↗</a></div>
  <div class="history-list" aria-label="Choose a round">
   <button type="button" class="history-item" data-round="0" aria-pressed="false"><span class="history-no">001–003</span><span class="history-name">ROUND 001</span></button>
   <button type="button" class="history-item" data-round="1" aria-pressed="false"><span class="history-no">004–006</span><span class="history-name">ROUND 002</span></button>
   <button type="button" class="history-item" data-round="2" aria-pressed="false"><span class="history-no">007–009</span><span class="history-name">ROUND 003</span></button>
   <button type="button" class="history-item" data-round="3" aria-pressed="false"><span class="history-no">010–012</span><span class="history-name">ROUND 004</span></button>
   <button type="button" class="history-item" data-round="4" aria-pressed="false"><span class="history-no">013–015</span><span class="history-name">ROUND 005</span></button>
   <button type="button" class="history-item" data-round="5" aria-pressed="false"><span class="history-no">016–018</span><span class="history-name">ROUND 006</span></button>
   <button type="button" class="history-item" data-round="6" aria-pressed="false"><span class="history-no">019</span><span class="history-name">RESERVED</span></button>
   <button type="button" class="history-item" data-round="7" aria-pressed="false"><span class="history-no">020–022</span><span class="history-name">RESERVED</span></button>
   <button type="button" class="history-item" data-round="8" aria-pressed="true"><span class="history-no">023–025</span><span class="history-name">LATEST</span></button>
  </div>
 </nav>
</main>
<script>
const names=["Patchwork Signals","Chromatic Inheritance","Residual Grammar","Grid Ecology","Signal Fracture","Living Syntax","Lattice Drift","Patch Relay","Signal Weather","Relay Spine","Cluster Grammar","Signal Weather","Coherent Weather","Relay Bloom","Quiet Pressure","Axial Drift","Fracture Atlas","Common Current","Autogenesis","Polyphony","Excitable Matter","Living Syntax II","Contact Grammar","Counterpoint","Continuum"];
const tiles=[...document.querySelectorAll('.tile')],loaded=new WeakSet(),buttons=[...document.querySelectorAll('[data-round]')];
const number=n=>String(n).padStart(3,'0');
let current=8;
const layouts019=['columns','strata','territories','continuous','woven','archipelago','faultline','monolith','register','crossroads','constellation','interlace'];
function newSeed(tile){tile.dataset.seed=String(crypto.getRandomValues(new Uint32Array(1))[0]);const used=tiles.filter(t=>t!==tile).map(t=>t.dataset.layout);const pool=layouts019.filter(l=>!used.includes(l)&&l!==tile.dataset.layout);tile.dataset.layout=pool[Math.floor(Math.random()*pool.length)];}
function sourceFor(tile,preview=true){const n=Number(tile.dataset.number),old=n<=12;if(n>=19){if(!tile.dataset.seed)newSeed(tile);return './'+(n===19?'autogenesis':n<=22?'polyphony':'continuum')+'.html#study='+n+'&seed='+tile.dataset.seed+'&layout='+tile.dataset.layout+(preview?'&preview=1':'');}return './'+(old?'source':n<=15?'living':'axial')+'.html?study='+(old?n+167:n)+(preview?'&preview=1':'')+'&refresh='+Date.now();}
function previewStatus(tile,label){let status=tile.querySelector('.preview-status');if(!status){status=document.createElement('div');status.className='preview-status';status.setAttribute('role','status');tile.querySelector('.screen').append(status);}status.textContent=label||'';status.hidden=!label;}
function navigate(tile,preview=true,attempt=0){
 const oldFrame=tile.querySelector('iframe'),is019=Number(tile.dataset.number)>=19;
 const frame=oldFrame.cloneNode(false);frame.removeAttribute('src');frame.removeAttribute('data-pending');
 const url=sourceFor(tile,preview);let settled=false;
 const valid=()=>tile.querySelector('iframe')===frame;
 if(is019){frame.dataset.pending='';previewStatus(tile,attempt?'Retrying preview…':'Loading preview…');}
 else previewStatus(tile,'');
 function retry(){if(settled||!valid())return;settled=true;if(attempt<3){previewStatus(tile,'Retrying preview…');setTimeout(()=>{if(valid())navigate(tile,preview,attempt+1)},400*(attempt+1));}else previewStatus(tile,'Preview unavailable — select New seed to retry');}
 function ready(){if(settled||!valid())return;let ok=false;try{const d=frame.contentWindow.__resetDiagnostics?.();ok=!!d&&d.study===Number(tile.dataset.number)&&String(d.seed)===tile.dataset.seed&&d.layout===tile.dataset.layout;}catch(e){}
 if(ok){settled=true;delete frame.dataset.pending;previewStatus(tile,'');syncTile(tile);}else retry();}
 frame.addEventListener('load',()=>{if(!valid())return;syncTile(tile);if(is019)setTimeout(ready,650);});
 frame.addEventListener('error',()=>{if(is019)retry();});
 frame.src=url;loaded.add(frame);oldFrame.replaceWith(frame);
 if(is019)setTimeout(()=>{if(!settled&&valid())ready();},10000);
 return frame;
}
function loadFrame(tile){const frame=tile.querySelector('iframe');return loaded.has(frame)?frame:navigate(tile,true);}
function message(tile,type,data){const frame=tile.querySelector('iframe');if(frame?.contentWindow)frame.contentWindow.postMessage({type,...data},location.origin);}
function isVisible(tile){if(document.hidden)return false;if(document.fullscreenElement)return document.fullscreenElement===tile;const r=tile.getBoundingClientRect();return r.bottom>0&&r.top<innerHeight&&r.right>0&&r.left<innerWidth;}
function syncTile(tile){const full=document.fullscreenElement===tile;message(tile,'study-visibility',{visible:isVisible(tile)});message(tile,'study-quality',{fullscreen:full,full});}
function syncAll(){for(const tile of tiles)syncTile(tile);}
function selectRound(round,write=true){
 current=Math.max(0,Math.min(8,round));const start=current>=7?20+(current-7)*3:current*3+1;
 document.querySelector('.intro h1').textContent='RESET / v.02 — '+(current===6?'019 — AUTOGENESIS / RESERVED':number(start)+'–'+number(start+2));
 document.querySelector('.intro p').textContent=current===8?'Contact dynamics · independent motion grammars · living structural memory':current===7?'Independent motion families · cellular shockwaves · structural counterpoint':current===6?'Reserved benchmark · three independent seeds':current===5?'Six compositional grammars · angular movement · living pigment':'Preserved studies · fresh seed on every load';
 document.querySelector('.grid').setAttribute('aria-label',current===6?'RESET 019 — three seeds':'RESET studies '+number(start)+' to '+number(start+2));
 buttons.forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.round)===current)));
 tiles.forEach((tile,i)=>{const n=current===6?19:start+i,name=names[n-1];tile.dataset.number=n;if(current>=6)newSeed(tile);tile.dataset.study=n<=12?n+167:n;tile.setAttribute('aria-label','Open study '+number(n)+' '+name+' fullscreen');tile.querySelector('.number span').textContent=number(n)+' — '+name.toUpperCase()+(current===6?' / SEED '+(i+1):'');const frame=tile.querySelector('iframe');frame.title='RESET '+number(n)+' — '+name;if(loaded.has(frame)||isVisible(tile))navigate(tile,true);});
 if(write)history.replaceState(null,'','#round-'+(current+1));
}
const observer=new IntersectionObserver(entries=>{for(const entry of entries){const tile=entry.target;if(entry.isIntersecting)loadFrame(tile);syncTile(tile);}},{threshold:.04});
const initial=location.hash.match(/^#round-([1-9])$/);selectRound(initial?Number(initial[1])-1:8,false);
buttons.forEach(b=>b.addEventListener('click',()=>selectRound(Number(b.dataset.round))));
tiles.forEach(tile=>{
 observer.observe(tile);
 const open=()=>{loadFrame(tile);if(typeof tile.requestFullscreen==='function'){try{const result=tile.requestFullscreen();if(result?.catch)result.catch(()=>{location.href=sourceFor(tile,false);});}catch(e){location.href=sourceFor(tile,false);}}else location.href=sourceFor(tile,false);};
 tile.addEventListener('click',open);
 tile.querySelector('.reseed').addEventListener('click',e=>{e.stopPropagation();if(Number(tile.dataset.number)>=19)newSeed(tile);navigate(tile,document.fullscreenElement!==tile);});
 tile.addEventListener('keydown',e=>{if(e.target===tile&&(e.key==='Enter'||e.key===' ')){e.preventDefault();open();}});
});
document.addEventListener('fullscreenchange',syncAll);document.addEventListener('visibilitychange',syncAll);window.addEventListener('resize',syncAll);
</script>
</body>
</html>
