function frame(now){requestAnimationFrame(frame);const dt=last?Math.min(.08,(now-last)/1000):.016;last=now;if(hidden||document.hidden)return;update(dt);if(now-lastPaint<(preview&&!full?50:25))return;lastPaint=now;if(gpu)gpu.draw();else drawCPU();stats.frames++}
window.__resetDiagnostics=()=>({seed,study,layout,unified,W,H,behaviours:counts.filter(n=>n>0).length,behaviourCounts:counts,cellGrid:[CW,CH],cellTransfers:stats.cellTransfers||0,modules:regions.length,edges:regions.reduce((a,m)=>a+m.edges.length,0),colour:colorOn,active:regions.filter(m=>m.energy>.2).length,pigment:regions.filter(m=>m.pig>.1).length,gpu:!!gpu,...stats});
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='study-visibility')hidden=!e.data.visible;if(e.data?.type==='study-quality'){const f=!!e.data.fullscreen;if(f!==full){full=f;}}});
requestAnimationFrame(frame);
</script></body></html>
