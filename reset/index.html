<title>RESET — lab</title>
<style>
*{box-sizing:border-box}
html{background:#fff;color:#111;font:13px Arial,sans-serif}
body{margin:0;min-height:100vh}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline}
header{display:flex;align-items:center;gap:18px;padding:14px 24px;border-bottom:1px solid #eee}
header a{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:bold}
header img{width:26px;height:26px}
header span{color:#777;font-size:12px}
main{max-width:1400px;margin:auto;padding:34px 24px 60px}
.kicker{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#999;margin:0 0 12px}
h1{font-size:22px;font-weight:normal;letter-spacing:-.035em;margin:0 0 28px}
.versions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.version{display:flex;flex-direction:column;justify-content:space-between;min-height:210px;padding:20px;border:1px solid #e6e6e6;transition:background .2s,border-color .2s}
.version:hover{background:#f7f7f5;border-color:#bbb;text-decoration:none}
.version-top{display:flex;justify-content:space-between;align-items:center}
.version-no{font-size:11px;letter-spacing:.14em;color:#777}
.arrow{font-size:18px;color:#999}
.version h2{font-size:17px;font-weight:normal;margin:0 0 7px}
.version p{font-size:11px;color:#888;line-height:1.6;margin:0;max-width:420px}
@media(max-width:600px){header{padding:12px}main{padding:26px 14px 40px}.versions{grid-template-columns:1fr}.version{min-height:170px}}
</style>
</head>
